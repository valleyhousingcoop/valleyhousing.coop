<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valley Housing Co-op</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 40px auto;
        width: min(100% - 32px, 480px);
        max-width: 480px;
      }
      @media (max-width: 520px) {
        body {
          margin-block: 24px;
        }
      }
      label,
      input,
      button {
        display: block;
        width: 100%;
        font-size: 16px;
      }
      input {
        padding: 10px;
        margin: 8px 0 16px;
      }
      button {
        padding: 12px;
        cursor: pointer;
      }
      small {
        color: #555;
      }
      img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
{{BODY}}
    <form method="post" action="https://vhc-workers.s-shanabrook.workers.dev">
      <label for="email">Sign up for our newsletter:</label>
      <input id="email" name="email" type="email" required />
      <button type="submit">Subscribe</button>
    </form>

    <p id="membership-counts" role="status"></p>

    <p><small>Have a suggestion for this website? Open an issue or submit a pull request to <a href="https://github.com/valleyhousingcoop/valleyhousing.coop">this repo</a>.</small></p>
    <script type="module">
      const status = document.getElementById("membership-counts");
      try {
        const response = await fetch("https://vhc-workers.s-shanabrook.workers.dev/api/member-counts", {
          credentials: "omit",
          signal: AbortSignal.timeout(15000),
        });
        if (!response.ok) throw new Error("Could not load membership counts");
        const counts = await response.json();
        const keys = ["total", "resident", "lenderDonor", "community"];
        if (
          !keys.every((key) => Number.isSafeInteger(counts[key]) && counts[key] >= 0) ||
          counts.total !== counts.resident + counts.lenderDonor + counts.community
        ) {
          throw new Error("Invalid membership counts");
        }
        status.textContent =
          `We currently have ${counts.total.toLocaleString()} members (` +
          `${counts.resident.toLocaleString()} resident, ` +
          `${counts.lenderDonor.toLocaleString()} lender/donor, ` +
          `${counts.community.toLocaleString()} community).`;
      } catch {
        status.textContent = "Member count unavailable.";
      }
    </script>
  </body>
</html>
